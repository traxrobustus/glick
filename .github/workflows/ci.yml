name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check, test and build (Linux, Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      # Android lint, the JVM tests and the Kotlin/Native Linux tests.
      - name: Check and test
        run: ./gradlew check --console=plain

      - name: Build the desktop app and the Android APK
        run: ./gradlew :app:createDistributable :androidApp:assembleDebug --console=plain

      - name: Keep the reports when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports-linux
          path: |
            **/build/reports/
            **/build/test-results/

  windows:
    name: Test and build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      # The JVM tests again on Windows, plus the Kotlin/Native Windows tests.
      - name: Test
        run: ./gradlew :core:jvmTest :core:mingwX64Test --console=plain

      - name: Build the desktop app
        run: ./gradlew :app:createDistributable --console=plain

      - name: Keep the reports when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports-windows
          path: |
            **/build/reports/
            **/build/test-results/
